services:

  nginx:
    build:
      context: ../nginx
    container_name: certifyhub-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

  postgres:
    image: postgres:15
    container_name: certifyhub-postgres
    environment:
      POSTGRES_DB: certifyhub
      POSTGRES_USER: certifyhub
      POSTGRES_PASSWORD: certifyhub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init_v1_0_0.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ../certifyhub-backend
    container_name: certifyhub-backend
    depends_on:
      - postgres
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/certifyhub
      DB_USERNAME: certifyhub
      DB_PASSWORD: certifyhub
    ports:
      - "8082:8082"

  frontend:
    build:
      context: ../certifyhub-frontend
    container_name: certifyhub-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data: